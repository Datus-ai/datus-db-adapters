# DATUS_TEST_* configures this container; the POSTGRESQL_* the tests read
# configures the client. See docs/adapter-testing-standard.md.
services:
  postgres:
    image: postgres:16
    environment:
      TZ: UTC
      POSTGRES_DB: ${DATUS_TEST_POSTGRESQL_DATABASE:-test}
      POSTGRES_USER: ${DATUS_TEST_POSTGRESQL_USER:-test_user}
      POSTGRES_PASSWORD: ${DATUS_TEST_POSTGRESQL_PASSWORD:-test_password}
    ports:
      - "${POSTGRESQL_HOST_PORT:-5432}:5432"
    healthcheck:
      # A real query, not pg_isready: pg_isready reports "accepting
      # connections" without authenticating, so a data volume left over from
      # different credentials would come up healthy and fail only at test time.
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
