name: BigQuery Cloud Tests

on:
  workflow_call:
    # Declared explicitly rather than relying on `secrets: inherit`, which would
    # hand this workflow every secret the caller can reach — including the
    # Hologres and MaxCompute credentials it has no business seeing.
    secrets:
      BIGQUERY_PROJECT:
        required: true
      BIGQUERY_DATASET:
        required: true
      BIGQUERY_CREDENTIALS_INFO:
        required: true
      BIGQUERY_LOCATION:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigquery-cloud-tests
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Credentials start here rather than at job level: the three steps above
      # are third-party actions, and a job-level env would put the service
      # account key in their process environment for no reason.
      - name: Verify cloud test configuration
        shell: bash
        env:
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_CREDENTIALS_INFO: ${{ secrets.BIGQUERY_CREDENTIALS_INFO }}
        run: |
          required=(
            BIGQUERY_PROJECT
            BIGQUERY_DATASET
            BIGQUERY_CREDENTIALS_INFO
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: ${name}"
              exit 1
            fi
          done

      - name: Run BigQuery contract and adapter tests
        env:
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
          BIGQUERY_CREDENTIALS_INFO: ${{ secrets.BIGQUERY_CREDENTIALS_INFO }}
        run: |
          uv run --all-packages --with pytest \
            pytest datus-bigquery/tests/integration -m integration --verbose
