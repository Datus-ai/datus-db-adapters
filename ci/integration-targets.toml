[targets.doris]
package = "datus-doris"
kind = "compose"

[targets.tidb]
package = "datus-tidb"
kind = "compose"

[targets.trino]
package = "datus-trino"
kind = "compose"

[targets.greenplum]
package = "datus-greenplum"
kind = "compose"

[targets.hive]
package = "datus-hive"
kind = "compose"

[targets.spark]
package = "datus-spark"
kind = "compose"

[targets.oracle]
package = "datus-oracle"
kind = "compose"

[targets.gaussdb]
package = "datus-gaussdb"
kind = "compose"

[targets.hologres]
package = "datus-hologres"
kind = "cloud"

[targets.maxcompute]
package = "datus-maxcompute"
kind = "cloud"
# No repository credentials or live CI instance are currently available.
enabled = false

[targets.bigquery]
package = "datus-bigquery"
kind = "cloud"

[targets.dws]
package = "datus-dws"
kind = "cloud"
# Verified against a live DWS 9.1.0 cluster during development. A DWS cluster is
# billed per hour and has no self-service serverless tier, so the workflow can
# create one per run and delete it afterwards (ci/cloud/dws/README.md) instead of
# keeping one online. Enable once either set of secrets is configured:
# HUAWEICLOUD_* + DWS_CI_* for ephemeral clusters, or DWS_HOST/_DATABASE/
# _USERNAME/_PASSWORD for a long-lived one.
enabled = false

[selection]
packages_without_live_targets = [
    "datus-clickzetta",
    "datus-db-core",
    "datus-redshift",
    "datus-snowflake",
    "datus-sqlalchemy",
]
