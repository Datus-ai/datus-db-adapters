services:
  oracle:
    # Oracle Database Free 23ai; shared with osi-engine's Oracle corpus tests.
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23-slim}
    environment:
      # The image uses ORACLE_PASSWORD for SYS/SYSTEM, while the host-side
      # ORACLE_PASSWORD remains the adapter test user's password.
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:?Set ORACLE_SYS_PASSWORD}
      APP_USER: datus_test
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD}
      ORACLE_APP_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD}
      ORACLE_PDB: ${ORACLE_PDB:-FREEPDB1}
    ports:
      - "127.0.0.1:${ORACLE_HOST_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    volumes:
      # These idempotent scripts run after every database start.
      - ./docker/init:/container-entrypoint-startdb.d:ro
      # Vendored Oracle sample schemas, installed by docker/init/02_install_hr_schema.sh.
      # Kept out of the startup directory so the runner does not execute them directly.
      - ./docker/sample-schemas:/opt/oracle/sample-schemas:ro
      # Oracle 19c and 23ai data files are not compatible.
      - oracle23free_data:/opt/oracle/oradata

volumes:
  oracle23free_data:
