# TiDB integration-test container.
#
# `--store=unistore` is TiDB's built-in single-node storage engine: one process,
# no PD and no TiKV, ready in about a second. It has no TiFlash, which costs
# nothing here — TiFlash is transparent to this adapter (the optimizer picks the
# store, and replica state is a plain information_schema query), so there is
# nothing about it for these tests to exercise.
services:
  tidb:
    image: pingcap/tidb:v8.5.0
    environment:
      TZ: UTC
    command:
      - --store=unistore
      - --host=0.0.0.0
      - --status-host=0.0.0.0
      - --initialize-sql-file=/init/init.sql
    ports:
      - "${TIDB_HOST_PORT:-24000}:4000"
      - "${TIDB_STATUS_HOST_PORT:-20080}:10080"
    volumes:
      - ./scripts/init.sql:/init/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:10080/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
