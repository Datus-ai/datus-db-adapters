name: Adapter CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

concurrency:
  group: adapter-ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve changed test base
        id: changed-base
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
              ;;
            merge_group)
              echo "ref=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ref=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run unit tests
        run: |
          if [ -n "${{ steps.changed-base.outputs.ref }}" ]; then
            ci/run-unit-tests.sh --changed "${{ steps.changed-base.outputs.ref }}"
          else
            ci/run-unit-tests.sh
          fi

      - name: Run impacted package build/import smoke
        if: steps.changed-base.outputs.ref != ''
        run: |
          uv run --no-project --isolated \
            --with packaging \
            python ci/run_package_smoke.py \
              --changed "${{ steps.changed-base.outputs.ref }}"

      - name: Run release tooling tests
        run: |
          uv run --no-project --isolated \
            --with packaging \
            --with pytest \
            python -m pytest ci/tests --verbose

  select-integration-tests:
    if: github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      compose: ${{ steps.select.outputs.compose }}
      oracle: ${{ steps.select.outputs.oracle }}
      cloud: ${{ steps.select.outputs.cloud }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select integration targets
        id: select
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "${MERGE_GROUP_BASE_SHA}" ]; then
            selection="$(python3 ci/select_affected.py \
              --base "${MERGE_GROUP_BASE_SHA}" \
              --format json)"
            python3 ci/select_affected.py \
              --base "${MERGE_GROUP_BASE_SHA}" \
              --format summary >> "$GITHUB_STEP_SUMMARY"
          else
            selection="$(python3 ci/select_affected.py --all --format json)"
            python3 ci/select_affected.py --all --format summary >> "$GITHUB_STEP_SUMMARY"
          fi

          python3 - "$selection" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          selection = json.loads(sys.argv[1])
          compose_targets = selection["compose_targets"]
          print(f"compose={json.dumps([target for target in compose_targets if target != 'oracle'], separators=(',', ':'))}")
          print(f"oracle={str('oracle' in compose_targets).lower()}")
          print(f"cloud={json.dumps(selection['cloud_targets'], separators=(',', ':'))}")
          PY

  compose-integration-tests:
    if: needs.select-integration-tests.result == 'success' && needs.select-integration-tests.outputs.compose != '[]'
    needs:
      - unit-tests
      - select-integration-tests
    runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJSON(needs.select-integration-tests.outputs.compose || '[]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run ${{ matrix.adapter }} integration tests
        run: ci/run-integration-tests.sh "${{ matrix.adapter }}"

      - name: Stop ${{ matrix.adapter }} integration services
        if: always()
        run: ci/run-integration-tests.sh --cleanup-only "${{ matrix.adapter }}"

  oracle-integration-tests:
    if: >-
      always() &&
      needs.unit-tests.result == 'success' &&
      needs.select-integration-tests.result == 'success' &&
      needs.select-integration-tests.outputs.oracle == 'true'
    needs:
      - unit-tests
      - select-integration-tests
      - compose-integration-tests
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Oracle integration tests without parallel Compose load
        run: ci/run-integration-tests.sh oracle

      - name: Stop Oracle integration services
        if: always()
        run: ci/run-integration-tests.sh --cleanup-only oracle

  hologres-cloud-tests:
    if: needs.select-integration-tests.result == 'success' && contains(fromJSON(needs.select-integration-tests.outputs.cloud || '[]'), 'hologres')
    needs:
      - unit-tests
      - select-integration-tests
    uses: ./.github/workflows/hologres-cloud-tests.yml
    secrets:
      HOLOGRES_HOST: ${{ secrets.HOLOGRES_HOST }}
      HOLOGRES_PORT: ${{ secrets.HOLOGRES_PORT }}
      HOLOGRES_DATABASE: ${{ secrets.HOLOGRES_DATABASE }}
      HOLOGRES_SCHEMA: ${{ secrets.HOLOGRES_SCHEMA }}
      HOLOGRES_ACCESS_KEY_ID: ${{ secrets.HOLOGRES_ACCESS_KEY_ID }}
      HOLOGRES_ACCESS_KEY_SECRET: ${{ secrets.HOLOGRES_ACCESS_KEY_SECRET }}
      HOLOGRES_SSLMODE: ${{ secrets.HOLOGRES_SSLMODE }}
      HOLOGRES_TEST_MATERIALIZED_VIEW: ${{ secrets.HOLOGRES_TEST_MATERIALIZED_VIEW }}
      HOLOGRES_SECONDARY_DATABASE: ${{ secrets.HOLOGRES_SECONDARY_DATABASE }}
      HOLOGRES_SECONDARY_SCHEMA: ${{ secrets.HOLOGRES_SECONDARY_SCHEMA }}
      HOLOGRES_TEST_FOREIGN_TABLE: ${{ secrets.HOLOGRES_TEST_FOREIGN_TABLE }}

  maxcompute-cloud-tests:
    if: needs.select-integration-tests.result == 'success' && contains(fromJSON(needs.select-integration-tests.outputs.cloud || '[]'), 'maxcompute')
    needs:
      - unit-tests
      - select-integration-tests
    uses: ./.github/workflows/maxcompute-cloud-tests.yml
    secrets:
      MAXCOMPUTE_ENDPOINT: ${{ secrets.MAXCOMPUTE_ENDPOINT }}
      MAXCOMPUTE_ACCESS_KEY_ID: ${{ secrets.MAXCOMPUTE_ACCESS_KEY_ID }}
      MAXCOMPUTE_ACCESS_KEY_SECRET: ${{ secrets.MAXCOMPUTE_ACCESS_KEY_SECRET }}
      MAXCOMPUTE_TWO_LEVEL_PROJECT: ${{ secrets.MAXCOMPUTE_TWO_LEVEL_PROJECT }}
      MAXCOMPUTE_THREE_LEVEL_PROJECT: ${{ secrets.MAXCOMPUTE_THREE_LEVEL_PROJECT }}

  bigquery-cloud-tests:
    if: needs.select-integration-tests.result == 'success' && contains(fromJSON(needs.select-integration-tests.outputs.cloud || '[]'), 'bigquery')
    needs:
      - unit-tests
      - select-integration-tests
    uses: ./.github/workflows/bigquery-cloud-tests.yml
    secrets:
      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
      BIGQUERY_CREDENTIALS_INFO: ${{ secrets.BIGQUERY_CREDENTIALS_INFO }}

  dws-cloud-tests:
    if: needs.select-integration-tests.result == 'success' && contains(fromJSON(needs.select-integration-tests.outputs.cloud || '[]'), 'dws')
    needs:
      - unit-tests
      - select-integration-tests
    uses: ./.github/workflows/dws-cloud-tests.yml
    secrets:
      DWS_HOST: ${{ secrets.DWS_HOST }}
      DWS_PORT: ${{ secrets.DWS_PORT }}
      DWS_DATABASE: ${{ secrets.DWS_DATABASE }}
      DWS_SCHEMA: ${{ secrets.DWS_SCHEMA }}
      DWS_USERNAME: ${{ secrets.DWS_USERNAME }}
      DWS_PASSWORD: ${{ secrets.DWS_PASSWORD }}
      DWS_SSLMODE: ${{ secrets.DWS_SSLMODE }}
      DWS_SSLROOTCERT_PEM: ${{ secrets.DWS_SSLROOTCERT_PEM }}
      # Ephemeral-cluster mode; unused when DWS_HOST points at a long-lived one.
      HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
      HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
      HUAWEICLOUD_PROJECT_ID: ${{ secrets.HUAWEICLOUD_PROJECT_ID }}
      HUAWEICLOUD_REGION: ${{ secrets.HUAWEICLOUD_REGION }}
      DWS_CI_VPC_ID: ${{ secrets.DWS_CI_VPC_ID }}
      DWS_CI_SUBNET_ID: ${{ secrets.DWS_CI_SUBNET_ID }}
      DWS_CI_SECURITY_GROUP_ID: ${{ secrets.DWS_CI_SECURITY_GROUP_ID }}
      DWS_CI_AVAILABILITY_ZONE: ${{ secrets.DWS_CI_AVAILABILITY_ZONE }}
      DWS_CI_DB_PASSWORD: ${{ secrets.DWS_CI_DB_PASSWORD }}

  integration-tests:
    if: always() && (github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs:
      - unit-tests
      - select-integration-tests
      - compose-integration-tests
      - oracle-integration-tests
      - hologres-cloud-tests
      - maxcompute-cloud-tests
      - bigquery-cloud-tests
      - dws-cloud-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected integration results
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          SELECT_RESULT: ${{ needs.select-integration-tests.result }}
          COMPOSE_RESULT: ${{ needs.compose-integration-tests.result }}
          ORACLE_RESULT: ${{ needs.oracle-integration-tests.result }}
          HOLOGRES_RESULT: ${{ needs.hologres-cloud-tests.result }}
          MAXCOMPUTE_RESULT: ${{ needs.maxcompute-cloud-tests.result }}
          BIGQUERY_RESULT: ${{ needs.bigquery-cloud-tests.result }}
          DWS_RESULT: ${{ needs.dws-cloud-tests.result }}
          COMPOSE_TARGETS: ${{ needs.select-integration-tests.outputs.compose }}
          ORACLE_SELECTED: ${{ needs.select-integration-tests.outputs.oracle }}
          CLOUD_TARGETS: ${{ needs.select-integration-tests.outputs.cloud }}
        run: |
          failed=0

          require_result() {
            local label="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "$label result was '$actual'; expected '$expected'." >&2
              failed=1
            fi
          }

          require_result "unit-tests" "$UNIT_RESULT" "success"
          require_result "select-integration-tests" "$SELECT_RESULT" "success"

          if [ "$COMPOSE_TARGETS" = "[]" ]; then
            require_result "compose-integration-tests" "$COMPOSE_RESULT" "skipped"
          else
            require_result "compose-integration-tests" "$COMPOSE_RESULT" "success"
          fi

          if [ "$ORACLE_SELECTED" = "true" ]; then
            require_result "oracle-integration-tests" "$ORACLE_RESULT" "success"
          else
            require_result "oracle-integration-tests" "$ORACLE_RESULT" "skipped"
          fi

          case "$CLOUD_TARGETS" in
            *'"hologres"'*) require_result "hologres-cloud-tests" "$HOLOGRES_RESULT" "success" ;;
            *) require_result "hologres-cloud-tests" "$HOLOGRES_RESULT" "skipped" ;;
          esac
          case "$CLOUD_TARGETS" in
            *'"maxcompute"'*) require_result "maxcompute-cloud-tests" "$MAXCOMPUTE_RESULT" "success" ;;
            *) require_result "maxcompute-cloud-tests" "$MAXCOMPUTE_RESULT" "skipped" ;;
          esac
          case "$CLOUD_TARGETS" in
            *'"bigquery"'*) require_result "bigquery-cloud-tests" "$BIGQUERY_RESULT" "success" ;;
            *) require_result "bigquery-cloud-tests" "$BIGQUERY_RESULT" "skipped" ;;
          esac
          case "$CLOUD_TARGETS" in
            *'"dws"'*) require_result "dws-cloud-tests" "$DWS_RESULT" "success" ;;
            *) require_result "dws-cloud-tests" "$DWS_RESULT" "skipped" ;;
          esac

          if [ "$failed" -ne 0 ]; then
            echo "One or more selected integration jobs failed." >&2
            exit 1
          fi
