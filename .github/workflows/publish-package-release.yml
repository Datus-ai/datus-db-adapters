name: "Publish Package Release"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package for single or recursive release (ignored when package boxes are checked)"
        required: false
        type: choice
        options:
          - datus-athena
          - datus-db-core
          - datus-sqlalchemy
          - datus-mysql
          - datus-postgresql
          - datus-starrocks
          - datus-doris
          - datus-sqlite
          - datus-duckdb
          - datus-tidb
          - datus-snowflake
          - datus-bigquery
          - datus-clickzetta
          - datus-clickhouse
          - datus-hive
          - datus-redshift
          - datus-spark
          - datus-trino
          - datus-greenplum
          - datus-maxcompute
          - datus-hologres
          - datus-oracle
          - datus-hana
          - datus-gaussdb
          - datus-dws
      version:
        description: "Version for a single selected package; leave empty or use auto for automatic versioning"
        required: false
        default: ""
        type: string
      recursive:
        description: "Publish the package from the dropdown and all its downstream packages (leave package boxes unchecked)"
        required: false
        default: false
        type: boolean
      datus-clickhouse:
        description: "datus-clickhouse"
        type: boolean
        default: false
      datus-doris:
        description: "datus-doris"
        type: boolean
        default: false
      datus-duckdb:
        description: "datus-duckdb"
        type: boolean
        default: false
      datus-gaussdb:
        description: "datus-gaussdb (openGauss)"
        type: boolean
        default: false
      datus-greenplum:
        description: "datus-greenplum"
        type: boolean
        default: false
      datus-hive:
        description: "datus-hive"
        type: boolean
        default: false
      datus-mysql:
        description: "datus-mysql"
        type: boolean
        default: false
      datus-postgresql:
        description: "datus-postgresql"
        type: boolean
        default: false
      datus-spark:
        description: "datus-spark"
        type: boolean
        default: false
      datus-sqlite:
        description: "datus-sqlite"
        type: boolean
        default: false
      datus-starrocks:
        description: "datus-starrocks"
        type: boolean
        default: false
      datus-tidb:
        description: "datus-tidb"
        type: boolean
        default: false
      datus-trino:
        description: "datus-trino"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Single and batch releases can touch the same package metadata.
  group: publish-package-release
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.source.outputs.ref }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record release source
        id: source
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=package-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Without a glob the key is static, and a GitHub cache key can never be
          # overwritten: one pruned snapshot (sdists without sources) was restored
          # by every run and broke any sdist build. Key it on the dependency set.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install release tooling
        run: pip install packaging twine

      - name: Build and validate all selected packages
        env:
          RELEASE_INPUTS: ${{ toJSON(inputs) }}
        run: python3 -m ci.publish_package_release prepare "$RUNNER_TEMP/package-release"

      - name: Store validated release plan and distributions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: ${{ runner.temp }}/package-release
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: Pypi Publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: pip install packaging twine

      - name: Download validated release plan and distributions
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/package-release

      - name: Publish workspace packages
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: python3 -m ci.publish_package_release publish "$RUNNER_TEMP/package-release"
