services:
  mongodb:
    image: mongo:8.0.38
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-47017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb_test_admin
      MONGO_INITDB_ROOT_PASSWORD: mongodb_test_password
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 20
