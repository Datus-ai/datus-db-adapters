name: BigQuery Cloud Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigquery-cloud-tests
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
      BIGQUERY_CREDENTIALS_INFO: ${{ secrets.BIGQUERY_CREDENTIALS_INFO }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify cloud test configuration
        shell: bash
        run: |
          required=(
            BIGQUERY_PROJECT
            BIGQUERY_DATASET
            BIGQUERY_CREDENTIALS_INFO
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: ${name}"
              exit 1
            fi
          done

      - name: Run BigQuery contract and adapter tests
        run: |
          uv run --all-packages --with pytest \
            pytest datus-bigquery/tests/integration -m integration --verbose
