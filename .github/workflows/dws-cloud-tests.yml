name: DWS Cloud Tests

on:
  workflow_call:
    # Declared explicitly rather than relying on `secrets: inherit`, which would
    # hand this workflow every secret the caller can reach — including the
    # BigQuery, Hologres and MaxCompute credentials it has no business seeing.
    #
    # Two modes, chosen by whether DWS_HOST is set:
    #   long-lived  DWS_HOST/_DATABASE/_USERNAME/_PASSWORD point at a cluster
    #               somebody keeps online.
    #   ephemeral   HUAWEICLOUD_* + DWS_CI_* let the job create a cluster for
    #               this run and delete it afterwards. A DWS cluster bills per
    #               hour with no self-service serverless tier, so this is the
    #               default for scheduled runs.
    secrets:
      DWS_HOST:
        required: false
      DWS_DATABASE:
        required: false
      DWS_USERNAME:
        required: false
      DWS_PASSWORD:
        required: false
      DWS_PORT:
        required: false
      DWS_SCHEMA:
        required: false
      DWS_SSLMODE:
        required: false
      DWS_SSLROOTCERT_PEM:
        required: false
      HUAWEICLOUD_SDK_AK:
        required: false
      HUAWEICLOUD_SDK_SK:
        required: false
      HUAWEICLOUD_PROJECT_ID:
        required: false
      HUAWEICLOUD_REGION:
        required: false
      DWS_CI_VPC_ID:
        required: false
      DWS_CI_SUBNET_ID:
        required: false
      DWS_CI_SECURITY_GROUP_ID:
        required: false
      DWS_CI_AVAILABILITY_ZONE:
        required: false
      DWS_CI_DB_PASSWORD:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dws-cloud-tests
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      # Each leg provisions its own cluster, so one failing version still
      # reports the others rather than masking them.
      fail-fast: false
      matrix:
        # DWS majors differ enough to be worth covering separately; a long-lived
        # cluster has whatever version it has, so the extra legs no-op there
        # (see the `skip` guard on the provisioning step).
        datastore_version:
          - "9.1.0.227"
          - "8.2.1.258"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Credentials start here rather than at job level: the three steps above
      # are third-party actions, and a job-level env would put the connection
      # secrets in their process environment for no reason.
      - name: Resolve cluster mode
        id: mode
        shell: bash
        env:
          DWS_HOST: ${{ secrets.DWS_HOST }}
          DWS_DATABASE: ${{ secrets.DWS_DATABASE }}
          DWS_USERNAME: ${{ secrets.DWS_USERNAME }}
          DWS_PASSWORD: ${{ secrets.DWS_PASSWORD }}
          HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
        run: |
          if [ -n "${DWS_HOST:-}" ]; then
            # A long-lived cluster has a fixed version: run the tests once and
            # let the remaining matrix legs skip.
            if [ "${{ strategy.job-index }}" != "0" ]; then
              echo "mode=skip" >> "${GITHUB_OUTPUT}"
              echo "::notice::Long-lived cluster mode covers one version; skipping ${{ matrix.datastore_version }}"
              exit 0
            fi
            for name in DWS_DATABASE DWS_USERNAME DWS_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::DWS_HOST is set, so ${name} is required too"
                exit 1
              fi
            done
            echo "mode=long-lived" >> "${GITHUB_OUTPUT}"
          elif [ -n "${HUAWEICLOUD_SDK_AK:-}" ]; then
            echo "mode=ephemeral" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Configure either DWS_HOST (long-lived cluster) or HUAWEICLOUD_SDK_AK (ephemeral cluster)"
            exit 1
          fi

      # Runs before the tests and is torn down by the always() step at the end.
      # Creating a cluster takes 10-15 minutes, which is why this job's timeout
      # is generous compared with the other cloud jobs.
      - name: Create ephemeral cluster
        id: provision
        if: steps.mode.outputs.mode == 'ephemeral'
        env:
          DWS_CI_DATASTORE_VERSION: ${{ matrix.datastore_version }}
          DWS_CI_NAME_SUFFIX: ${{ matrix.datastore_version }}
          HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
          HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
          HUAWEICLOUD_PROJECT_ID: ${{ secrets.HUAWEICLOUD_PROJECT_ID }}
          HUAWEICLOUD_REGION: ${{ secrets.HUAWEICLOUD_REGION }}
          DWS_CI_VPC_ID: ${{ secrets.DWS_CI_VPC_ID }}
          DWS_CI_SUBNET_ID: ${{ secrets.DWS_CI_SUBNET_ID }}
          DWS_CI_SECURITY_GROUP_ID: ${{ secrets.DWS_CI_SECURITY_GROUP_ID }}
          DWS_CI_AVAILABILITY_ZONE: ${{ secrets.DWS_CI_AVAILABILITY_ZONE }}
          DWS_CI_DB_PASSWORD: ${{ secrets.DWS_CI_DB_PASSWORD }}
        run: |
          uv run --no-project --isolated --with huaweicloudsdkdws==3.1.161 \
            python ci/cloud/dws/cluster.py up

      - name: Materialize CA certificate
        if: steps.mode.outputs.mode != 'skip'
        shell: bash
        env:
          DWS_SSLROOTCERT_PEM: ${{ secrets.DWS_SSLROOTCERT_PEM }}
        run: |
          # The CA is held as PEM content rather than a path, so write it out
          # with restrictive permissions and never echo it.
          if [ -n "${DWS_SSLROOTCERT_PEM:-}" ]; then
            umask 077
            printf '%s' "${DWS_SSLROOTCERT_PEM}" > "${RUNNER_TEMP}/dws-ca.pem"
            echo "DWS_SSLROOTCERT=${RUNNER_TEMP}/dws-ca.pem" >> "${GITHUB_ENV}"
          else
            echo "::notice::DWS_SSLROOTCERT_PEM is unset; verify-ca assertions will be skipped"
          fi

      - name: Run DWS integration tests
        if: steps.mode.outputs.mode != 'skip'
        # DWS_SSLROOTCERT is not listed here: the step above exports it through
        # GITHUB_ENV as a path, since the certificate arrives as PEM content.
        # In ephemeral mode the connection details come from the provision step
        # and the password is the one it created the cluster with.
        env:
          DWS_HOST: ${{ steps.provision.outputs.host || secrets.DWS_HOST }}
          DWS_PORT: ${{ steps.provision.outputs.port || secrets.DWS_PORT }}
          DWS_DATABASE: ${{ steps.provision.outputs.database || secrets.DWS_DATABASE }}
          DWS_SCHEMA: ${{ secrets.DWS_SCHEMA }}
          DWS_USERNAME: ${{ steps.provision.outputs.username || secrets.DWS_USERNAME }}
          DWS_PASSWORD: ${{ steps.mode.outputs.mode == 'ephemeral' && secrets.DWS_CI_DB_PASSWORD || secrets.DWS_PASSWORD }}
          DWS_SSLMODE: ${{ secrets.DWS_SSLMODE }}
        run: |
          uv run --all-packages --with pytest \
            pytest datus-dws/tests/integration -m integration --verbose

      # always(): an ephemeral cluster bills until it is deleted, so this must
      # run after a failed test step, a cancelled job, or a failed provision
      # that still left a cluster behind. `reap` is the backstop for the cases
      # where this step never runs at all.
      - name: Delete ephemeral cluster
        if: always() && steps.provision.outputs.cluster_id != ''
        env:
          HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
          HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
          HUAWEICLOUD_PROJECT_ID: ${{ secrets.HUAWEICLOUD_PROJECT_ID }}
          HUAWEICLOUD_REGION: ${{ secrets.HUAWEICLOUD_REGION }}
          DWS_CI_CLUSTER_ID: ${{ steps.provision.outputs.cluster_id }}
        run: |
          uv run --no-project --isolated --with huaweicloudsdkdws==3.1.161 \
            python ci/cloud/dws/cluster.py down --wait
