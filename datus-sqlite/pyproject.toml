[project]
name = "datus-sqlite"
version = "0.1.0"
description = "Native SQLite database adapter for Datus"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "datus-db-core>=0.1.10", "pydantic>=2.0.0",
    "pyarrow>=14.0.0", "pandas>=2.1.4",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]

[project.entry-points."datus.adapters"]
sqlite = "datus_sqlite:register"

[tool.uv.sources]
datus-db-core = {workspace = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datus_sqlite"]

[tool.pytest.ini_options]
markers = [
    "integration: tests using a real SQLite database (no server required)",
    "acceptance: core functionality validation",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["datus_sqlite"]
omit = ["tests/*", "**/__init__.py"]
