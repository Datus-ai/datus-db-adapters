[package]
name = "datus-mongodb"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "_mongosql"
crate-type = ["cdylib"]

[dependencies]
bson = "2.15"
mongosql = { git = "https://github.com/mongodb/mongosql", rev = "27f5bc492ef6240e658b88b700c51d154667c8b4" }
pyo3 = { version = "0.29", features = ["abi3-py312", "extension-module"] }
serde_json = "1"
