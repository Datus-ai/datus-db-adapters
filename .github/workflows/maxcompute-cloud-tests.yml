name: MaxCompute Cloud Tests

on:
  workflow_call:
    # Declared explicitly rather than relying on `secrets: inherit`, which would
    # hand this workflow every secret the caller can reach — including the
    # BigQuery and Hologres credentials it has no business seeing.
    secrets:
      MAXCOMPUTE_ENDPOINT:
        required: true
      MAXCOMPUTE_ACCESS_KEY_ID:
        required: true
      MAXCOMPUTE_ACCESS_KEY_SECRET:
        required: true
      MAXCOMPUTE_TWO_LEVEL_PROJECT:
        required: true
      MAXCOMPUTE_THREE_LEVEL_PROJECT:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxcompute-cloud-tests
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maxcompute-integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Credentials start here rather than at job level: the three steps above
      # are third-party actions, and a job-level env would put the connection
      # secrets in their process environment for no reason.
      - name: Verify cloud test configuration
        shell: bash
        env:
          MAXCOMPUTE_ENDPOINT: ${{ secrets.MAXCOMPUTE_ENDPOINT }}
          MAXCOMPUTE_ACCESS_KEY_ID: ${{ secrets.MAXCOMPUTE_ACCESS_KEY_ID }}
          MAXCOMPUTE_ACCESS_KEY_SECRET: ${{ secrets.MAXCOMPUTE_ACCESS_KEY_SECRET }}
          MAXCOMPUTE_TWO_LEVEL_PROJECT: ${{ secrets.MAXCOMPUTE_TWO_LEVEL_PROJECT }}
          MAXCOMPUTE_THREE_LEVEL_PROJECT: ${{ secrets.MAXCOMPUTE_THREE_LEVEL_PROJECT }}
        run: |
          required=(
            MAXCOMPUTE_ENDPOINT
            MAXCOMPUTE_ACCESS_KEY_ID
            MAXCOMPUTE_ACCESS_KEY_SECRET
            MAXCOMPUTE_TWO_LEVEL_PROJECT
            MAXCOMPUTE_THREE_LEVEL_PROJECT
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required MaxCompute integration secret: ${name}"
              exit 1
            fi
          done

      - name: Run two-level and three-level tests
        env:
          MAXCOMPUTE_ENDPOINT: ${{ secrets.MAXCOMPUTE_ENDPOINT }}
          MAXCOMPUTE_ACCESS_KEY_ID: ${{ secrets.MAXCOMPUTE_ACCESS_KEY_ID }}
          MAXCOMPUTE_ACCESS_KEY_SECRET: ${{ secrets.MAXCOMPUTE_ACCESS_KEY_SECRET }}
          MAXCOMPUTE_TWO_LEVEL_PROJECT: ${{ secrets.MAXCOMPUTE_TWO_LEVEL_PROJECT }}
          MAXCOMPUTE_THREE_LEVEL_PROJECT: ${{ secrets.MAXCOMPUTE_THREE_LEVEL_PROJECT }}
        run: |
          uv run --all-packages --with pytest \
            pytest datus-maxcompute/tests/integration -m integration --verbose
