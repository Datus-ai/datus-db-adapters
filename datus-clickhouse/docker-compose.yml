services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"
    environment:
      TZ: UTC
      CLICKHOUSE_USER: ${DATUS_TEST_CLICKHOUSE_USER:-default_user}
      CLICKHOUSE_PASSWORD: ${DATUS_TEST_CLICKHOUSE_PASSWORD:-default_test}
      CLICKHOUSE_DB: ${DATUS_TEST_CLICKHOUSE_DATABASE:-default_test}
    healthcheck:
      # The init server binds only loopback. Use the container's network address
      # and target database so initialization must finish before reporting healthy.
      test: ["CMD-SHELL", "clickhouse-client --host \"$$(hostname)\" --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --database \"$${CLICKHOUSE_DB}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  clickhouse_data:
