[project]
name = "datus-databricks"
version = "0.1.0"
description = "Databricks SQL warehouse adapter for Datus"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "DatusAI", email = "support@datus.ai"}
]
keywords = ["datus", "database", "databricks", "adapter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "datus-db-core>=0.1.10",
    "datus-sqlalchemy>=0.1.12",
    "databricks-sdk>=0.30",
    # Connector 4.x requires pandas>=2.2, which this workspace cannot resolve
    # while datus-snowflake keeps pandas<2.2. The SQLAlchemy dialect ships in
    # the connector's sqlalchemy extra through 3.x.
    "databricks-sql-connector[sqlalchemy]>=3.7.4,<4",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Datus-ai/datus-db-adapters"
Repository = "https://github.com/Datus-ai/datus-db-adapters"
Issues = "https://github.com/Datus-ai/datus-db-adapters/issues"

[project.entry-points."datus.adapters"]
databricks = "datus_databricks:register"

[tool.uv.sources]
datus-db-core = { workspace = true }
datus-sqlalchemy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datus_databricks"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "acceptance: marks tests as acceptance tests for CI/CD (core functionality validation)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["datus_databricks"]
omit = ["tests/*", "**/__init__.py"]
