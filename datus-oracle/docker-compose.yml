services:
  oracle:
    # Pin the multi-platform image so preserved databases cannot outlive a moving tag.
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23.26.3-slim@sha256:6d61d267a3b978c24c5ac1790e62e927416a0aec446bd86e4b3a1527562757bd}
    environment:
      TZ: UTC
      # DATUS_TEST_* configures this container; the ORACLE_* the tests read
      # configures the client. The image's own ORACLE_PASSWORD is SYS/SYSTEM.
      ORACLE_PASSWORD: ${DATUS_TEST_ORACLE_SYS_PASSWORD:?Set DATUS_TEST_ORACLE_SYS_PASSWORD}
      APP_USER: ${DATUS_TEST_ORACLE_USER:-datus_test}
      APP_USER_PASSWORD: ${DATUS_TEST_ORACLE_PASSWORD:?Set DATUS_TEST_ORACLE_PASSWORD}
      ORACLE_APP_PASSWORD: ${DATUS_TEST_ORACLE_PASSWORD:?Set DATUS_TEST_ORACLE_PASSWORD}
      ORACLE_PDB: ${ORACLE_PDB:-FREEPDB1}
    ports:
      - "127.0.0.1:${ORACLE_HOST_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    volumes:
      # These idempotent scripts run after every database start.
      - ./docker/init:/container-entrypoint-startdb.d:ro
      # Vendored Oracle sample schemas, installed by docker/init/02_install_hr_schema.sh.
      # Kept out of the startup directory so the runner does not execute them directly.
      - ./docker/sample-schemas:/opt/oracle/sample-schemas:ro
      - oracle23free_data:/opt/oracle/oradata

volumes:
  oracle23free_data:
    # CI preserves this volume across runs (ADAPTER_PRESERVE_VOLUMES in
    # ci/integration/adapters/oracle.sh) to skip re-expanding the multi-GB
    # system datafiles on every cold start. The name is keyed by ORACLE_IMAGE
    # because database and timezone files can differ between image versions.
    # Bumping the image switches to a fresh volume; older volumes remain
    # available for diagnosis or rollback and must be cleaned up explicitly.
    name: datus-oracle-data-${ORACLE_DATA_VOLUME_KEY:-default}
