services:
  # Single-container FE + BE, published by the Doris project for integration
  # testing. It carries its own tuned fe.conf / be.conf (including
  # force_olap_table_replication_num = 1) and a HEALTHCHECK that only reports
  # healthy once the backend is registered and alive, so nothing here needs to
  # patch config or re-implement a readiness probe. FE_CONFIG_EXTRA /
  # BE_CONFIG_EXTRA are the escape hatch if a single knob ever needs changing.
  doris:
    image: apache/doris:all-in-one-4.1.3
    environment:
      # UTC so date arithmetic does not depend on where the suite runs.
      TZ: UTC
    ports:
      - "${DORIS_QUERY_HOST_PORT:-9030}:9030"
      - "${DORIS_HTTP_HOST_PORT:-8030}:8030"
    volumes:
      - doris_fe_data:/opt/apache-doris/fe/doris-meta
      - doris_be_data:/opt/apache-doris/be/storage
    networks:
      - doris-test

  hive-metastore:
    image: apache/hive:4.0.1
    environment:
      SERVICE_NAME: metastore
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/9083) 2>/dev/null || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
    networks:
      - doris-test

networks:
  doris-test:
    name: datus-doris-test-network

volumes:
  doris_fe_data:
  doris_be_data:
  hive_warehouse:
