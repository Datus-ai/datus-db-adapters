services:
  starrocks:
    image: starrocks/allin1-ubuntu:3.3-latest
    environment:
      # UTC so date arithmetic does not depend on where the suite runs.
      - TZ=UTC
    ports:
      - "${STARROCKS_QUERY_HOST_PORT:-9030}:9030"  # MySQL protocol port
      - "${STARROCKS_HTTP_HOST_PORT:-8030}:8030"  # HTTP port
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - starrocks_data:/data
    networks:
      - starrocks-test

  # Backs the Hive external-catalog tests. The FE resolves the metastore by
  # service name over the compose network (HIVE_METASTORE_URI is what the
  # CREATE EXTERNAL CATALOG statement embeds), mirroring datus-doris.
  hive-metastore:
    image: apache/hive:4.0.1
    environment:
      SERVICE_NAME: metastore
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/9083) 2>/dev/null || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
    networks:
      - starrocks-test

networks:
  starrocks-test:
    name: datus-starrocks-test-network

volumes:
  starrocks_data:
  hive_warehouse:
