[project]
name = "datus-mongodb"
version = "0.1.0"
description = "Read-only MongoDB SQL and document adapter for Datus"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["datus-db-core>=0.1.11", "pymongo>=4.10,<5"]

[project.optional-dependencies]
sql = ["pyarrow>=14.0.0", "pandas>=2.1.4"]

[project.entry-points."datus.adapters"]
mongodb = "datus_mongodb:register"

[tool.uv.sources]
datus-db-core = {workspace = true}

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "datus_mongodb._mongosql"
locked = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "acceptance: marks tests as acceptance tests for CI/CD (core functionality validation)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["datus_mongodb"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
